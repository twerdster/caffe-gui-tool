<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="552" viewBox="0 0 1200 552" role="img" aria-labelledby="title desc">
<title id="title">Compose, check and export a geometric neural network</title><desc id="desc">Three steps: compose an editable node graph, check its connections and export JSON and Caffe definitions. A Beltrami stage follows image, derivatives, metric, flux, divergence and update. This is a schematic, not a trained result.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
<rect x="0" y="0" width="1200" height="552" rx="24" fill="#f3f7f5" stroke="none"/>
<text x="36" y="40" font-size="13" fill="#527568" font-weight="700" letter-spacing="2">CAFFE GUI TOOL  /  THE WORKFLOW</text>
<text x="36" y="89" font-size="36" fill="#142d31" font-weight="700" >Make the computation visible.</text>
<text x="36" y="120" font-size="18" fill="#526a6d" font-weight="400" >Change a connection, a filter or a whole stage. Keep the mathematical structure in sight.</text>
<rect x="36" y="151" width="352" height="241" rx="18" fill="#ffffff" stroke="#dbe5e1"/>
<rect x="56" y="170" width="38" height="30" rx="9" fill="#e9e3f8" stroke="none"/>
<text x="65" y="191" font-size="14" fill="#294445" font-weight="700" >01</text>
<text x="108" y="194" font-size="24" fill="#173339" font-weight="700" >Compose</text>
<text x="56" y="225" font-size="15" fill="#526a6d" font-weight="400" >Connect the pieces of your experiment.</text>
<rect x="424" y="151" width="352" height="241" rx="18" fill="#ffffff" stroke="#dbe5e1"/>
<rect x="444" y="170" width="38" height="30" rx="9" fill="#def1e7" stroke="none"/>
<text x="453" y="191" font-size="14" fill="#294445" font-weight="700" >02</text>
<text x="496" y="194" font-size="24" fill="#173339" font-weight="700" >Check</text>
<text x="444" y="225" font-size="15" fill="#526a6d" font-weight="400" >Catch broken graphs before exporting.</text>
<rect x="812" y="151" width="352" height="241" rx="18" fill="#ffffff" stroke="#dbe5e1"/>
<rect x="832" y="170" width="38" height="30" rx="9" fill="#e1ecf7" stroke="none"/>
<text x="841" y="191" font-size="14" fill="#294445" font-weight="700" >03</text>
<text x="884" y="194" font-size="24" fill="#173339" font-weight="700" >Export</text>
<text x="832" y="225" font-size="15" fill="#526a6d" font-weight="400" >Take the graph into your next step.</text>
<rect x="57" y="274" width="83" height="33" rx="8" fill="#dcecf8" stroke="none"/>
<text x="69" y="296" font-size="14" fill="#294445" font-weight="600" >Image</text>
<rect x="180" y="255" width="120" height="33" rx="8" fill="#e9e3f8" stroke="none"/>
<text x="192" y="277" font-size="14" fill="#294445" font-weight="600" >Derivative</text>
<rect x="180" y="325" width="120" height="33" rx="8" fill="#def1e7" stroke="none"/>
<text x="192" y="347" font-size="14" fill="#294445" font-weight="600" >Metric</text>
<path d="M140 290 C163 290 157 271 180 271 M240 288 V325" fill="none" stroke="#85a49c" stroke-width="2"/>
<circle cx="455" cy="266" r="9" fill="#e0f1e7"/>
<path d="M450 266 l4 4 6 -8" fill="none" stroke="#267252" stroke-width="2"/>
<text x="474" y="271" font-size="17" fill="#34544b" font-weight="400" >Check connections</text>
<circle cx="455" cy="301" r="9" fill="#e0f1e7"/>
<path d="M450 301 l4 4 6 -8" fill="none" stroke="#267252" stroke-width="2"/>
<text x="474" y="306" font-size="17" fill="#34544b" font-weight="400" >Preserve shared weights</text>
<circle cx="455" cy="336" r="9" fill="#e0f1e7"/>
<path d="M450 336 l4 4 6 -8" fill="none" stroke="#267252" stroke-width="2"/>
<text x="474" y="341" font-size="17" fill="#34544b" font-weight="400" >Keep the original graph</text>
<rect x="832" y="249" width="312" height="31" rx="7" fill="#f0f5fa" stroke="none"/>
<text x="845" y="271" font-size="15" fill="#355976" font-weight="400" class="mono">graph.json</text>
