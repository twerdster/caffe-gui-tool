<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Caffe-GUI-Tool · visual network definitions</title><desc id="desc">Explanatory schematic of the historical Blender add-on, not a screenshot or trained result.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#172b3a}.title{font-size:24px;font-weight:700}.sub{font-size:14px;fill:#526575}.head{font-size:19px;font-weight:700}.body{font-size:14px}.mono{font-size:13px;font-family:Menlo,Consolas,monospace}.note{font-size:13px;fill:#526575}</style>
<rect width="960" height="360" rx="16" fill="#f8fafc"/>
<text x="28" y="42" class="title">Caffe-GUI-Tool · visual network definitions</text>
<text x="28" y="68" class="sub">Explanatory schematic of the historical Blender add-on, not a screenshot or trained result.</text>
<rect x="28" y="100" width="276" height="164" rx="14" fill="#fff7ed" stroke="#e58729" stroke-width="1.5"/>
<text x="46" y="132" class="head">1. Blender node graph</text>
<text x="46" y="162" class="body">Data and layer nodes</text>
<text x="46" y="187" class="body">Connect inputs and outputs</text>
<text x="46" y="212" class="body">Set layer and solver options</text>
<path d="M307 182 H334" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="342" y="100" width="276" height="164" rx="14" fill="#eef2ff" stroke="#6877d9" stroke-width="1.5"/>
<text x="360" y="132" class="head">2. Python exporter</text>
<text x="360" y="162" class="body">CaffeNodes.py</text>
<text x="360" y="187" class="body">CaffeGenerate.py</text>
<text x="360" y="212" class="body">Traverse the graph</text>
<path d="M621 182 H648" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="656" y="100" width="276" height="164" rx="14" fill="#ecfdf5" stroke="#31a77f" stroke-width="1.5"/>
<text x="674" y="132" class="head">3. Caffe text files</text>
<text x="674" y="162" class="body">*_train_test.prototxt</text>
<text x="674" y="187" class="body">*_deploy.prototxt</text>
<text x="674" y="212" class="body">*_solver.prototxt</text>
<text x="28" y="302" class="note">Original source and credits are preserved. Current Blender support lives in Blender Neural Composer.</text>
<text x="28" y="325" class="note">Exporting a definition is separate from running Caffe or training a model.</text>
</svg>
